# Template for config/paths.local.yaml (gitignored). Copy this file and
# fill in real paths; data never enters git (Methods Spec principle 5).
data_root: "/path/to/DATA_ROOT"
raw_dir: "/path/to/DATA_ROOT/raw"
interim_dir: "/path/to/DATA_ROOT/interim"
processed_dir: "/path/to/DATA_ROOT/processed"
outputs_dir: "/path/to/DATA_ROOT/outputs"

# Optional: permanent cache of raw global ISIMIP files, reused across all
# study countries so they are never re-downloaded (see docs/DECISIONS.md,
# COMANDO 11). Can live anywhere with enough free space.
isimip_global_cache_dir: "/path/to/ISIMIP_CACHE"

# Optional: internal-SSD staging area for in-progress downloads before they
# are moved into isimip_global_cache_dir (see docs/DECISIONS.md, COMANDO 12).
isimip_staging_dir: "/path/to/SSD_STAGING"
