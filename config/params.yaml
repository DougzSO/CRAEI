# =====================================================================
# C23 scope and code audit, v0. FROZEN BEFORE RUN.
# Criteria are provisional. Changing any value after the run requires a
# dated entry in DECISIONS.md (old value, new value, reason).
# Sweeps are not methodological parameters: they turn tier-3 choices
# into reported curves instead of single-point definitions.
# =====================================================================
scope_audit:
  version: v0
  frozen_before_run: true
  primary_country: BRA
  matrix_countries: [BRA, IND, PRT]
  out_of_scope_technologies: [solar, wind]   # fleet table only (share denominator)
  min_plants: 30
  min_effective_n: 10              # effective_n = min(n_distinct_cells, n_distinct_basins)
  min_fleet_share_pct: 5           # bucket share of the country's GW in that fleet
  saturation_low_pct: 5
  saturation_high_pct: 95
  min_gcm_sign_agreement: 4        # of 5
  sign_criterion_applies_to: [H1, H2, H4]   # H3 has no GCM ensemble: sign = N/A, report invariance
  limitation_downgrade: "principal -> suporte"
  class_precedence: "excluido > suporte > principal"
  aggregate_rule: "principal if principal in all 3 scenarios; excluido if excluido in all 3; else suporte"
  change_policy: "alter only with dated entry in DECISIONS.md"

threshold_sweeps:
  tier: n/a
  frozen_before_run: true
  heat_dtx35_days:         {start: 0,    stop: 90,   step: 5}
  drought_rd_ratio:        {start: 1.0,  stop: 4.0,  step: 0.25}
  drought_spei_threshold:  {start: -0.5, stop: -2.5, step: -0.25}
  model_agreement_k_of_5:  [3, 4, 5]
  coastal_buffer_km:       [0, 2, 5, 10, 20]   # only if derivable from existing tables; else report cost
  grid_2d: {x: drought_spei_threshold, y: drought_rd_ratio, buckets: hydro}
  curve_countries: [BRA]
  curve_buckets: [hydro, thermal]    # map to actual bucket names in plant_hazards
  baseline_reproduction_tolerance_pp: 0.5   # base-value point must reproduce exposure_summary within this

code_audit:
  frozen_before_run: true
  ruff_select: [F401, F841, F811, ERA001, C901, T201]
  max_complexity: 15
  vulture_min_confidence: 60
  long_function_lines: 80
  long_file_lines: 600
  scope_keywords: [IND, PRT, India, Portugal, solar, wind, compound]
