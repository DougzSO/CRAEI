# Every methodological numeric parameter, with value, evidence tier (1/2/3)
# and source. Alternatives are tested one-at-a-time (Methods Spec §1.8, §3
# Step 12). No methodological number is hardcoded outside this file.

coastal_buffer_km:
  value: 5
  tier: 3
  source: "Methods Spec §1.2, author assumption"
  alternatives: [2, 10]

heat_tx35_threshold_c:
